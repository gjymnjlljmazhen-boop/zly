<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b0f1c">
<title>照顾好自己</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #1b0912;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* 背景：三层缓慢漂移的暖色光雾 */
  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 78vmax; height: 78vmax;
    left: -28vmax; top: -34vmax;
    background: radial-gradient(circle, rgba(255, 96, 140, 0.30), rgba(255, 96, 140, 0) 65%);
    animation: drift-a 26s ease-in-out infinite alternate;
  }
  body::after {
    width: 70vmax; height: 70vmax;
    right: -26vmax; bottom: -30vmax;
    background: radial-gradient(circle, rgba(255, 168, 120, 0.26), rgba(255, 168, 120, 0) 66%);
    animation: drift-b 32s ease-in-out infinite alternate;
  }
  @keyframes drift-a {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(8vmax, 6vmax, 0) scale(1.12); }
  }
  @keyframes drift-b {
    from { transform: translate3d(0, 0, 0) scale(1.05); }
    to   { transform: translate3d(-7vmax, -5vmax, 0) scale(0.95); }
  }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

  .stage {
    position: relative;
    z-index: 2;
    height: 100%;
    display: grid; place-items: center;
    padding: 18px;
  }

  .paper {
    position: relative;
    width: min(420px, 100%);
    max-height: min(80vh, 660px);
    display: flex; flex-direction: column;
    border-radius: 24px;
    background: linear-gradient(170deg, rgba(255, 245, 248, 0.97), rgba(255, 226, 236, 0.95));
    box-shadow:
      0 30px 70px rgba(120, 20, 60, 0.45),
      0 0 0 1px rgba(255, 255, 255, 0.6) inset,
      0 1px 0 rgba(255, 255, 255, 0.9) inset;
    overflow: hidden;
    animation: rise 0.9s cubic-bezier(.2, .9, .25, 1.05) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(22px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }

  /* 卡片顶部的一道光扫过 */
  .paper::after {
    content: "";
    position: absolute;
    top: -40%; left: -60%;
    width: 60%; height: 180%;
    background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,0.55), rgba(255,255,255,0));
    transform: rotate(8deg);
    animation: sweep 7s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes sweep {
    0%, 62% { left: -60%; opacity: 0; }
    70% { opacity: 0.7; }
    88%, 100% { left: 120%; opacity: 0; }
  }

  .head {
    position: relative;
    padding: 14px 22px 10px;
    border-bottom: 1px dashed rgba(190, 90, 130, 0.26);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
  }
  .title {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: #7c2b4a;
    letter-spacing: 0.03em;
  }
  .subtitle {
    margin-top: 6px;
    font-size: 11.5px;
    letter-spacing: 0.28em;
    color: #b4637f;
    text-transform: uppercase;
  }
  .pulse {
    position: absolute;
    right: 22px; top: 26px;
    width: 15px; height: 15px;
    background: linear-gradient(140deg, #ff8fb0, #e0285f);
    transform: rotate(-45deg);
    border-radius: 2px;
    animation: beat 1.25s ease-in-out infinite;
  }
  .pulse::before, .pulse::after {
    content: ""; position: absolute; width: 15px; height: 15px;
    border-radius: 50%; background: inherit;
  }
  .pulse::before { top: -7.5px; left: 0; }
  .pulse::after { top: 0; left: 7.5px; }
  @keyframes beat {
    0%, 100% { transform: rotate(-45deg) scale(1); }
    16% { transform: rotate(-45deg) scale(1.18); }
    32% { transform: rotate(-45deg) scale(1); }
    48% { transform: rotate(-45deg) scale(1.1); }
  }

  .body {
    padding: 16px 22px 18px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    color: #4b2233;
    font-size: 15px;
    line-height: 1.95;
    mask-image: linear-gradient(180deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
  }
  .body::-webkit-scrollbar { width: 4px; }
  .body::-webkit-scrollbar-thumb { background: rgba(180, 99, 127, 0.28); border-radius: 4px; }

  .line {
    margin: 0 0 12px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.55s ease, transform 0.55s ease;
  }
  .line.in { opacity: 1; transform: none; }
  .line.soft { color: #8a4f66; font-style: italic; }
  .hi { color: #c0275a; font-weight: 700; }

  .foot {
    padding: 0 22px 20px;
    display: flex; justify-content: center;
  }
  #ok {
    font: inherit; font-size: 15px; font-weight: 700;
    color: #fff; border: 0; cursor: pointer;
    padding: 12px 30px; border-radius: 999px;
    background: linear-gradient(135deg, #ff8fb0, #e0285f);
    box-shadow: 0 12px 26px rgba(224, 40, 95, 0.38);
    transition: transform 0.16s ease, filter 0.16s ease;
  }
  #ok:active { transform: scale(0.96); }

  .finale {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: radial-gradient(120% 90% at 50% 40%, rgba(60, 12, 32, 0.88), rgba(10, 4, 8, 0.95));
    opacity: 0; pointer-events: none;
    transition: opacity 0.7s ease;
    z-index: 5;
    text-align: center;
    padding: 24px;
  }
  .finale.show { opacity: 1; }
  .finale .words {
    max-width: min(86vw, 460px);
  }
  .finale .words p {
    margin: 0;
    font-size: min(6.6vw, 27px);
    font-weight: 700;
    line-height: 1.9;
    letter-spacing: 0.02em;
    color: #ffe4ee;
    text-shadow: 0 10px 36px rgba(255, 60, 120, 0.38);
  }
  .finale .words p.gap { margin-top: 0.7em; }
  .finale .words p:last-child { color: #ffc2d6; }

  @media (prefers-reduced-motion: reduce) {
    body::before, body::after, .paper::after, .pulse { animation: none; }
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="stage">
  <div class="paper">
    <div class="head">
      <div class="pulse" aria-hidden="true"></div>
    </div>
    <div class="body" id="body">
      <p class="line">你来姨妈的时候，记得少碰点冷水，也别洗头发。</p>
      <p class="line">如果非要洗，那洗完一定要<span class="hi">立刻吹干</span>。</p>
      <p class="line">晚上按时睡觉，别熬夜；按时吃饭，别太劳累。</p>
      <p class="line">生冷的东西少吃，心情要一直好好的。</p>
      <p class="line">天冷了注意保暖，晚上睡觉一定盖好被子，别着凉。</p>
      <p class="line">冷饮少喝，尤其是可乐；油炸的也少碰。</p>
      <p class="line">别学喝酒，每天睡够八小时。</p>
      <p class="line">生冷、寒冷、咸辣的都少吃一点，多喝温热的、能促进血液循环的饮料。</p>
      <p class="line">衣服穿厚点，饭多吃点，别剧烈运动，也别大晚上出门。</p>
      <p class="line soft">这些我都替你记着，你只要照着做就好。</p>
      <p class="line"><span class="hi">照顾好自己。</span></p>
    </div>
    <div class="foot">
      <button id="ok">我记住了</button>
    </div>
  </div>
</div>

<div class="finale" id="finale">
  <div class="words">
    <p>有压力是正常的，</p>
    <p>说出来总会好一些。</p>
    <p class="gap">不要把所有的压力和不开心，</p>
    <p>都悄无声息地消化。</p>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("fx");
  const ctx = canvas.getContext("2d");
  const body = document.getElementById("body");
  const lines = [...document.querySelectorAll(".line")];
  const finale = document.getElementById("finale");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let W = 0, H = 0, dpr = 1;
  const petals = [];
  const hearts = [];
  const bokeh = [];

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 光斑按屏幕大小重排
    bokeh.length = 0;
    for (let i = 0; i < 9; i += 1) {
      bokeh.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 30 + Math.random() * 70,
        vx: (Math.random() - 0.5) * 6,
        vy: -4 - Math.random() * 8,
        a: 0.05 + Math.random() * 0.07,
        hue: 335 + Math.random() * 20,
      });
    }
  }

  /** 樱花花瓣：两段贝塞尔，底部收尖 */
  function petalPath(size) {
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.bezierCurveTo(size * 0.8, -size * 0.5, size * 0.72, size * 0.62, 0, size);
    ctx.bezierCurveTo(-size * 0.72, size * 0.62, -size * 0.8, -size * 0.5, 0, -size);
    ctx.closePath();
  }

  function spawnPetal(initial) {
    petals.push({
      x: Math.random() * W,
      y: initial ? Math.random() * H : -20 - Math.random() * 60,
      size: 5 + Math.random() * 6,
      rot: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 1.5,
      vy: 20 + Math.random() * 34,
      sway: 14 + Math.random() * 26,
      speed: 0.6 + Math.random() * 1.0,
      phase: Math.random() * Math.PI * 2,
      alpha: 0.35 + Math.random() * 0.35,
      warm: Math.random() < 0.3,
    });
    if (petals.length > 90) petals.shift();
  }

  function initPetals() {
    petals.length = 0;
    const n = Math.round(W / 10);
    for (let i = 0; i < Math.min(46, n); i += 1) spawnPetal(true);
  }

  function heartShape(x, y, s, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(s / 24, s / 24);
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.bezierCurveTo(-12, -4, -12, -13, -6, -14);
    ctx.bezierCurveTo(-2, -14.6, 0, -11, 0, -9);
    ctx.bezierCurveTo(0, -11, 2, -14.6, 6, -14);
    ctx.bezierCurveTo(12, -13, 12, -4, 0, 6);
    ctx.closePath();
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = now / 1000;

    ctx.clearRect(0, 0, W, H);

    // 1) 背景光斑
    for (const b of bokeh) {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.y < -b.r) { b.y = H + b.r; b.x = Math.random() * W; }
      if (b.x < -b.r) b.x = W + b.r;
      if (b.x > W + b.r) b.x = -b.r;
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0, `hsla(${b.hue}, 95%, 78%, ${b.a})`);
      g.addColorStop(1, `hsla(${b.hue}, 95%, 78%, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 2) 落下的花瓣
    if (!reduceMotion && Math.random() < dt * 3.2) spawnPetal(false);
    for (let i = petals.length - 1; i >= 0; i -= 1) {
      const p = petals[i];
      p.y += p.vy * dt;
      p.rot += p.spin * dt;
      p.x += Math.sin(t * p.speed + p.phase) * p.sway * dt;
      if (p.y > H + 30) { petals.splice(i, 1); continue; }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.alpha;
      const g = ctx.createLinearGradient(0, -p.size, 0, p.size);
      if (p.warm) {
        g.addColorStop(0, "rgba(255, 236, 232, 0.95)");
        g.addColorStop(1, "rgba(255, 160, 175, 0.9)");
      } else {
        g.addColorStop(0, "rgba(255, 245, 250, 0.95)");
        g.addColorStop(1, "rgba(255, 186, 208, 0.9)");
      }
      ctx.fillStyle = g;
      petalPath(p.size);
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // 3) 偶尔飘起的心
    if (!reduceMotion && Math.random() < dt * 0.5) {
      hearts.push({
        x: Math.random() * W,
        y: H + 14,
        s: 7 + Math.random() * 9,
        vy: -(14 + Math.random() * 18),
        vx: (Math.random() - 0.5) * 10,
        rot: (Math.random() - 0.5) * 0.5,
        spin: (Math.random() - 0.5) * 0.6,
        life: 0,
        maxLife: 9 + Math.random() * 4,
        hue: 335 + Math.random() * 20,
      });
    }
    for (let i = hearts.length - 1; i >= 0; i -= 1) {
      const h = hearts[i];
      h.life += dt;
      if (h.life > h.maxLife) { hearts.splice(i, 1); continue; }
      h.x += (h.vx + Math.sin(t + h.s) * 12) * dt;
      h.y += h.vy * dt;
      h.rot += h.spin * dt;
      const k = h.life / h.maxLife;
      const a = (k < 0.12 ? k / 0.12 : 1 - Math.max(0, (k - 0.65) / 0.35)) * 0.45;
      ctx.globalAlpha = a;
      heartShape(h.x, h.y, h.s, h.rot);
      ctx.fillStyle = `hsla(${h.hue}, 88%, 74%, 1)`;
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }

  // 文案逐条淡入
  lines.forEach((el, i) => {
    setTimeout(() => el.classList.add("in"), 180 + i * 120);
  });

  document.getElementById("ok").addEventListener("click", () => {
    finale.classList.add("show");
    for (let i = 0; i < 42; i += 1) {
      hearts.push({
        x: W * (0.2 + Math.random() * 0.6),
        y: H * (0.55 + Math.random() * 0.2),
        s: 7 + Math.random() * 8,
        vy: -(50 + Math.random() * 110),
        vx: (Math.random() - 0.5) * 110,
        rot: Math.random() * 3,
        spin: (Math.random() - 0.5) * 2.2,
        life: 0,
        maxLife: 2 + Math.random() * 1.6,
        hue: 330 + Math.random() * 25,
      });
    }
    for (let i = 0; i < 26; i += 1) {
      petals.push({
        x: W * (0.15 + Math.random() * 0.7),
        y: H * (0.5 + Math.random() * 0.25),
        size: 5 + Math.random() * 6,
        rot: Math.random() * 6,
        spin: (Math.random() - 0.5) * 3,
        vy: -(30 + Math.random() * 60),
        sway: 20,
        speed: 1.2,
        phase: Math.random() * 6,
        alpha: 0.7,
        warm: Math.random() < 0.4,
      });
    }
  });

  addEventListener("resize", () => { resize(); initPetals(); });
  resize();
  initPetals();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
