<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>❤ 粒子爱心</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    display: grid;
    place-items: center;
  }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 640 / 480));
    height: auto;
    aspect-ratio: 640 / 480;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="c" width="640" height="480"></canvas>
<script>
(() => {
  "use strict";

  // ===== 与原版 Python 一一对应的参数 =====
  const CANVAS_WIDTH = 640;
  const CANVAS_HEIGHT = 480;
  const CX = CANVAS_WIDTH / 2;
  const CY = CANVAS_HEIGHT / 2;
  const IMAGE_ENLARGE = 11;
  const HEART_COLOR = "#ff2121";
  const FRAME_MS = 160;
  const GENERATE_FRAME = 20;

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });

  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));

  /** 爱心参数方程：x = 16sin³t，y = -(13cost - 5cos2t - 2cos3t - cos4t) */
  function heartFunction(t, shrinkRatio = IMAGE_ENLARGE) {
    let x = 16 * Math.sin(t) ** 3;
    let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    x *= shrinkRatio;
    y *= shrinkRatio;
    x += CX;
    y += CY;
    return [x, y];
  }

  /** 内部散点：指数分布把点往中心聚 */
  function scatterInside(x, y, beta = 0.15) {
    const rx = -beta * Math.log(Math.random());
    const ry = -beta * Math.log(Math.random());
    const dx = rx * (x - CX);
    const dy = ry * (y - CY);
    return [x - dx, y - dy];
  }

  /** 光晕收缩：越靠近中心，力越大 */
  function shrink(x, y, ratio) {
    const force = -1 / (((x - CX) ** 2 + (y - CY) ** 2) ** 0.6);
    const dx = ratio * force * (x - CX);
    const dy = ratio * force * (y - CY);
    return [x - dx, y - dy];
  }

  /** 周期曲线：决定缩放随帧的呼吸 */
  function curve(p) {
    return (2 * (2 * Math.sin(4 * p))) / (2 * Math.PI);
  }

  /** 每帧的位置偏移（原版的「魔法参数」0.520） */
  function calcPosition(x, y, ratio) {
    const force = 1 / (((x - CX) ** 2 + (y - CY) ** 2) ** 0.52);
    const dx = ratio * force * (x - CX) + randInt(-1, 1);
    const dy = ratio * force * (y - CY) + randInt(-1, 1);
    return [x - dx, y - dy];
  }

  // ===== 静态点集，只建一次 =====
  const points = [];        // 爱心轮廓点
  const edgePoints = [];    // 边缘扩散
  const centerPoints = [];  // 中心扩散

  function build(number = 2000) {
    const seen = new Set();
    for (let i = 0; i < number; i += 1) {
      const t = rand(0, 2 * Math.PI);
      const [x, y] = heartFunction(t);
      const key = x + "," + y;
      if (seen.has(key)) continue;
      seen.add(key);
      points.push([x, y]);
    }
    for (const [x, y] of points) {
      for (let k = 0; k < 3; k += 1) edgePoints.push(scatterInside(x, y, 0.05));
    }
    for (let i = 0; i < 4000; i += 1) {
      const [bx, by] = points[randInt(0, points.length - 1)];
      centerPoints.push(scatterInside(bx, by, 0.17));
    }
  }

  // ===== 每帧动态点 =====
  function calc(frame) {
    const phase = (frame / 10) * Math.PI;
    const c = curve(phase);
    const ratio = 10 * c;
    const haloRadius = 4 + 6 * (1 + c);
    const haloNumber = Math.floor(3000 + 4000 * Math.abs(c ** 2));

    const out = [];

    // 1) 光晕：沿爱心轮廓生成，再 shrink 收缩
    const haloSeen = new Set();
    for (let i = 0; i < haloNumber; i += 1) {
      const t = rand(0, 2 * Math.PI);
      let [x, y] = heartFunction(t, 11.6);
      [x, y] = shrink(x, y, haloRadius);
      const key = x + "," + y;
      if (haloSeen.has(key)) continue;
      haloSeen.add(key);
      x += randInt(-14, 14);
      y += randInt(-14, 14);
      out.push([x, y, [1, 2, 2][randInt(0, 2)]]);
    }

    // 2) 爱心本体
    for (const [x0, y0] of points) {
      const [x, y] = calcPosition(x0, y0, ratio);
      out.push([x, y, randInt(1, 3)]);
    }

    // 3) 边缘扩散
    for (const [x0, y0] of edgePoints) {
      const [x, y] = calcPosition(x0, y0, ratio);
      out.push([x, y, randInt(1, 2)]);
    }

    // 4) 中心扩散
    for (const [x0, y0] of centerPoints) {
      const [x, y] = calcPosition(x0, y0, ratio);
      out.push([x, y, randInt(1, 2)]);
    }

    return out;
  }

  function render(framePoints) {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    ctx.fillStyle = HEART_COLOR;
    for (let i = 0; i < framePoints.length; i += 1) {
      const [x, y, size] = framePoints[i];
      ctx.fillRect(x | 0, y | 0, size, size);
    }
  }

  build();

  let frame = 0;
  let last = 0;
  function tick(now) {
    if (now - last >= FRAME_MS) {
      last = now;
      render(calc(frame % GENERATE_FRAME));
      frame += 1;
    }
    requestAnimationFrame(tick);
  }

  // 先画一帧，避免首屏空白
  render(calc(0));
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
