<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1030">
<title>弹窗爱心</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1030; }
  body {
    font: 13px/1.4 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(120% 80% at 50% 0%, #2a1747 0%, #1b1030 45%, #0d0818 100%);
  }
  #stage { position: fixed; inset: 0; overflow: hidden; }

  .win {
    position: absolute;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.38), 0 0 0 1px rgba(255, 255, 255, 0.35) inset;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.12s ease, transform 0.12s ease;
    will-change: opacity, transform;
  }
  .win.show { opacity: 1; transform: scale(1); }
  .win.out { opacity: 0; transform: scale(0.9); }

  .bar {
    height: 22%;
    min-height: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6px;
    background: rgba(255, 255, 255, 0.55);
    color: #333;
    font-size: 9px;
    letter-spacing: 0.05em;
  }
  .bar b { font-weight: 600; }
  .dots { display: flex; gap: 3px; }
  .dots i {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(0, 0, 0, 0.28);
    display: block;
  }
  .body {
    height: 78%;
    display: grid;
    place-items: center;
    text-align: center;
    color: #2b2b2b;
    font-weight: 600;
    padding: 2px;
  }

  .tip {
    position: fixed;
    left: 0; right: 0;
    bottom: max(18px, env(safe-area-inset-bottom));
    text-align: center;
    color: rgba(255, 200, 225, 0.55);
    font-size: 12px;
    letter-spacing: 0.16em;
  }
</style>
</head>
<body>
<div id="stage"></div>
<div class="tip" id="tip">ESC 或点一下，关掉全部</div>
<script>
(() => {
  "use strict";

  const stage = document.getElementById("stage");
  const tipEl = document.getElementById("tip");

  const TIPS = ["学业有成", "好好爱自己", "好好吃饭", "保持好心情",
                "身体健康", "顺顺利利", "别熬夜", "天凉了多穿衣服"];
  const COLORS = ["#ffd1dc", "#cfe9ff", "#d6f5d6", "#fff6cc", "#ff9ec4", "#cfe4ff"];

  const params = new URLSearchParams(location.search);
  const STATIC = params.get("static") === "1";   // 只渲染"爱心成形"那一刻，方便截图

  let W = 0, H = 0;
  let winW = 150, winH = 60, scale = 1;
  const wins = [];
  let timers = [];

  function measure() {
    W = stage.clientWidth;
    H = stage.clientHeight;
    // 原脚本按 1920×1080 设计（窗口 150×60、心形半径 20）；这里按屏宽等比缩放
    scale = Math.max(0.42, Math.min(1.15, Math.min(W, H) / 780));
    winW = Math.round(150 * scale);
    winH = Math.round(60 * scale);
  }

  /** 与原 heart_points 完全同一条参数方程，只是把 20px 的单位按屏幕缩放 */
  function heartPoints(n) {
    const pts = [];
    const unit = 20 * scale;
    for (let i = 0; i < n; i += 1) {
      const t = (i / n) * Math.PI * 2;
      const x = 16 * Math.sin(t) ** 3;
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      const sx = W / 2 + x * unit - winW * 0.34;
      const sy = H / 2 - y * unit - winH * 1.1;
      pts.push([sx, sy]);
    }
    return pts;
  }

  function makeWindow(x, y, text, colorIndex) {
    const el = document.createElement("div");
    el.className = "win";
    el.style.width = winW + "px";
    el.style.height = winH + "px";
    el.style.left = Math.round(x) + "px";
    el.style.top = Math.round(y) + "px";
    el.style.background = COLORS[colorIndex % COLORS.length];
    el.innerHTML =
      '<div class="bar"><b>提示</b><span class="dots"><i></i><i></i><i></i></span></div>' +
      '<div class="body">' + text + "</div>";
    stage.appendChild(el);
    wins.push(el);
    // 下一帧再加 show，触发过渡
    requestAnimationFrame(() => el.classList.add("show"));
    return el;
  }

  function closeAll(immediate) {
    for (const t of timers) clearTimeout(t);
    timers = [];
    for (const el of wins) {
      if (immediate) el.remove();
      else {
        el.classList.add("out");
        setTimeout(() => el.remove(), 260);
      }
    }
    wins.length = 0;
  }

  function pick(list) { return list[(Math.random() * list.length) | 0]; }

  async function run() {
    closeAll(true);
    measure();

    // ① 沿心形依次弹出
    const pts = heartPoints(100);
    for (let i = 0; i < pts.length; i += 1) {
      const [x, y] = pts[i];
      const text = i === pts.length - 1 ? "我喜欢你" : pick(TIPS);
      makeWindow(x, y, text, (Math.random() * COLORS.length) | 0);
      await sleep(30);
    }

    if (STATIC) {
      tipEl.textContent = "爱心成形 · 静态预览";
      return;
    }

    await sleep(1000);
    // ② 爱心消失
    for (const el of wins) {
      el.classList.add("out");
      setTimeout(() => el.remove(), 200);
    }
    wins.length = 0;

    await sleep(300);
    // ③ 满屏随机弹窗
    const count = Math.floor(W / winW) * Math.floor(H / winH) + 50;
    for (let i = 0; i < count; i += 1) {
      const x = Math.random() * (W - winW);
      const y = Math.random() * (H - winH);
      makeWindow(x, y, pick(TIPS), (Math.random() * COLORS.length) | 0);
      if (i % 3 === 0) await sleep(8);
    }

    await sleep(3000);
    // ④ 逐个关闭
    const step = wins.length ? 1000 / wins.length : 0;
    const snapshot = [...wins];
    for (const el of snapshot) {
      el.classList.add("out");
      setTimeout(() => el.remove(), 200);
      if (step > 1) await sleep(step);
    }
    wins.length = 0;
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeAll(true); tipEl.textContent = "已全部关闭 · 点一下重播"; }
  });
  addEventListener("pointerdown", (e) => {
    if (STATIC) return;
    if (e.target.closest(".win")) return;
    run();
  });
  addEventListener("resize", () => { if (STATIC) run(); });

  measure();
  if (STATIC) {
    run();
  } else {
    run();
  }
})();
</script>
</body>
</html>
