<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0a1c">
<title>❤</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(120% 100% at 50% 8%, #4a1236 0%, #240d24 48%, #0b050d 100%);
    -webkit-tap-highlight-color: transparent;
  }

  /* 中央大爱心：一层渐变 + 两层光晕 */
  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
  }

  .big {
    position: relative;
    width: min(72vmin, 460px);
    aspect-ratio: 1;
    animation: thump 1.35s cubic-bezier(.5, 0, .5, 1) infinite;
    filter: drop-shadow(0 24px 60px rgba(255, 45, 99, 0.55));
  }

  /* 心形本体：旋转 45° 的方形 + 两个圆（经典做法） */
  .big .shape {
    position: absolute;
    inset: 18%;
    transform: rotate(-45deg);
    background: linear-gradient(150deg, #ff9bb8 0%, #ff4d79 42%, #c2124a 100%);
    border-radius: 0 0 8% 8%;
  }
  .big .shape::before,
  .big .shape::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: inherit;
  }
  .big .shape::before { top: -50%; left: 0; }
  .big .shape::after { top: 0; left: 50%; }

  /* 高光 */
  .big .gloss {
    position: absolute;
    inset: 18%;
    transform: rotate(-45deg);
    border-radius: 0 0 8% 8%;
    background: radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.55), transparent 42%);
    mix-blend-mode: screen;
    opacity: 0.75;
  }
  .big .gloss::before,
  .big .gloss::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: inherit;
  }
  .big .gloss::before { top: -50%; left: 0; }
  .big .gloss::after { top: 0; left: 50%; }

  /* 外圈光晕 */
  .halo {
    position: absolute;
    inset: -14%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 77, 121, 0.42) 0%, rgba(255, 77, 121, 0.12) 45%, transparent 68%);
    animation: halo 2.7s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes thump {
    0%, 100% { transform: scale(1); }
    12% { transform: scale(1.085); }
    26% { transform: scale(0.995); }
    40% { transform: scale(1.05); }
    62% { transform: scale(1); }
  }

  @keyframes halo {
    0%, 100% { transform: scale(1); opacity: 0.55; }
    20% { transform: scale(1.12); opacity: 0.9; }
    55% { transform: scale(1); opacity: 0.5; }
  }

  /* 小爱心粒子画布 */
  #sparks {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .caption {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(6vh, calc(env(safe-area-inset-bottom) + 22px));
    text-align: center;
    color: rgba(255, 255, 255, 0.5);
    font: 13px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    letter-spacing: 0.08em;
    animation: fade 3.4s ease-in-out infinite;
  }
  @keyframes fade { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.72; } }

  @media (prefers-reduced-motion: reduce) {
    .big, .halo, .caption { animation: none; }
  }
</style>
</head>
<body>
  <canvas id="sparks" aria-hidden="true"></canvas>

  <div class="stage" id="stage" role="img" aria-label="一颗跳动的大爱心">
    <div class="big">
      <div class="halo"></div>
      <div class="shape"></div>
      <div class="gloss"></div>
    </div>
  </div>

  <div class="caption">点一下，会有心跳</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("sparks");
  const ctx = canvas.getContext("2d");
  const stage = document.getElementById("stage");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sparks = [];
  const COLORS = ["#ff4d79", "#ff7ba0", "#ffb3c9", "#ff2d63"];

  let width = 0, height = 0, dpr = 1;

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    width = canvas.clientWidth;
    height = canvas.clientHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function heartPath(c, x, y, s, r) {
    c.save();
    c.translate(x, y);
    c.rotate(r);
    c.scale(s / 24, s / 24);
    c.beginPath();
    c.moveTo(0, 6);
    c.bezierCurveTo(-12, -4, -12, -13, -6, -14);
    c.bezierCurveTo(-2, -14.6, 0, -11, 0, -9);
    c.bezierCurveTo(0, -11, 2, -14.6, 6, -14);
    c.bezierCurveTo(12, -13, 12, -4, 0, 6);
    c.closePath();
    c.restore();
  }

  function pop(count = 22) {
    const cx = width / 2;
    const cy = height / 2;
    const radius = Math.min(width, height) * 0.22;
    for (let i = 0; i < count; i += 1) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.25;
      const speed = radius * (3.2 + Math.random() * 2.6);
      sparks.push({
        x: cx + Math.cos(angle) * radius * 0.4,
        y: cy + Math.sin(angle) * radius * 0.4,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 60,
        size: 8 + Math.random() * 16,
        life: 0.9 + Math.random() * 0.7,
        age: 0,
        rot: (Math.random() - 0.5) * 0.9,
        spin: (Math.random() - 0.5) * 2.4,
        color: COLORS[(Math.random() * COLORS.length) | 0],
      });
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    ctx.clearRect(0, 0, width, height);

    for (let i = sparks.length - 1; i >= 0; i -= 1) {
      const p = sparks[i];
      p.age += dt;
      if (p.age >= p.life) { sparks.splice(i, 1); continue; }
      p.vy += 420 * dt;
      p.vx *= 0.995;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.spin * dt;

      const k = p.age / p.life;
      ctx.globalAlpha = Math.max(0, 1 - k * k);
      heartPath(ctx, p.x, p.y, p.size * (1 - k * 0.35), p.rot);
      ctx.fillStyle = p.color;
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  // 每次心跳（1.35s 周期）就轻震一下，点按则是大爆发
  if (!reduceMotion) {
    setInterval(() => {
      if (document.hidden) return;
      if (navigator.vibrate) navigator.vibrate(8);
    }, 1350);
  }

  stage.addEventListener("pointerdown", (event) => {
    pop(26);
    if (navigator.vibrate) navigator.vibrate([12, 40, 12]);
  });

  addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
