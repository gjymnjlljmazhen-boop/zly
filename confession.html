<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12060f">
<title>有件事想告诉你</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #2a0e22 0%, #150812 55%, #08040a 100%);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    padding: 22px;
  }
  .card {
    position: relative;
    width: min(360px, 100%);
    padding: 30px 24px 26px;
    border-radius: 24px;
    text-align: center;
    background: linear-gradient(165deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.035));
    border: 1px solid rgba(255, 190, 215, 0.22);
    box-shadow: 0 26px 60px rgba(255, 60, 110, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .card.hide { opacity: 0; transform: translateY(-14px) scale(0.98); }

  .title {
    font-size: 13px;
    letter-spacing: 0.3em;
    color: rgba(255, 190, 215, 0.65);
    margin-bottom: 16px;
  }
  .text {
    min-height: 96px;
    font-size: 17px;
    line-height: 1.9;
    color: #ffe9f1;
    white-space: pre-wrap;
  }
  .caret {
    display: inline-block;
    width: 2px; height: 1.05em;
    background: #ff86ab;
    vertical-align: -0.18em;
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .actions {
    margin-top: 22px;
    display: flex;
    gap: 12px;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .actions.show { opacity: 1; pointer-events: auto; }

  button {
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 26px;
    border-radius: 999px;
    border: 0;
    cursor: pointer;
    transition: transform 0.16s ease, filter 0.16s ease, background 0.16s ease;
  }
  button:active { transform: scale(0.96); }
  #yes {
    color: #fff;
    background: linear-gradient(135deg, #ff7ba0, #ff2d63);
    box-shadow: 0 10px 26px rgba(255, 45, 99, 0.45);
  }
  #no {
    color: rgba(255, 225, 235, 0.8);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 190, 215, 0.22);
    transition: transform 0.28s cubic-bezier(.2, .9, .3, 1.3), opacity 0.4s ease;
  }

  .final {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.8s ease;
    z-index: 5;
  }
  .final.show { opacity: 1; }
  .final .big {
    font-size: min(13vw, 54px);
    font-weight: 800;
    letter-spacing: 0.06em;
    background: linear-gradient(120deg, #fff, #ffb3c9 45%, #ff5c8a);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 8px 26px rgba(255, 60, 110, 0.45));
  }
  .final .sub {
    margin-top: 14px;
    color: rgba(255, 210, 228, 0.7);
    font-size: 14px;
    letter-spacing: 0.2em;
  }

  .tip {
    position: fixed; left: 0; right: 0;
    bottom: max(16px, env(safe-area-inset-bottom));
    text-align: center;
    color: rgba(255, 190, 215, 0.35);
    font-size: 12px; letter-spacing: 0.16em;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="stage">
  <div class="card" id="card">
    <div class="title" id="title">TO YOU</div>
    <div class="text"><span id="typed"></span><span class="caret" id="caret"></span></div>
    <div class="actions" id="actions">
      <button id="yes">愿意</button>
      <button id="no">再想想</button>
    </div>
  </div>
</div>

<div class="final" id="final">
  <div>
    <div class="big" id="finalBig">那……说好了</div>
    <div class="sub" id="finalSub">以后请多指教 ❤</div>
  </div>
</div>

<div class="tip">点一下屏幕，加速</div>

<script>
(() => {
  "use strict";

  // ====== 想改内容就改这里 ======
  const NAME = "";                 // 填对方名字，会显示在顶部
  const LINES = [
    "认识你之后，",
    "我的很多个平常日子，",
    "都变得有点不一样了。",
    "",
    "所以想认真地告诉你：",
    "我喜欢你，很久了。",
  ];
  const QUESTION = "愿意和我在一起吗？";
  const FINAL_BIG = "那……说好了";
  const FINAL_SUB = "以后请多指教 ❤";
  // ============================

  const canvas = document.getElementById("fx");
  const ctx = canvas.getContext("2d");
  const typedEl = document.getElementById("typed");
  const caret = document.getElementById("caret");
  const actions = document.getElementById("actions");
  const card = document.getElementById("card");
  const finalEl = document.getElementById("final");
  const titleEl = document.getElementById("title");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (NAME) titleEl.textContent = "TO " + NAME.toUpperCase();

  // ---------- 背景：上升的心 ----------
  let W = 0, H = 0, dpr = 1;
  const hearts = [];
  const bursts = [];

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function heartPath(x, y, s, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(s / 24, s / 24);
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.bezierCurveTo(-12, -4, -12, -13, -6, -14);
    ctx.bezierCurveTo(-2, -14.6, 0, -11, 0, -9);
    ctx.bezierCurveTo(0, -11, 2, -14.6, 6, -14);
    ctx.bezierCurveTo(12, -13, 12, -4, 0, 6);
    ctx.closePath();
    ctx.restore();
  }

  function spawn() {
    hearts.push({
      x: Math.random() * W,
      y: H + 20,
      s: 6 + Math.random() * 14,
      vy: -(16 + Math.random() * 34),
      vx: (Math.random() - 0.5) * 10,
      rot: (Math.random() - 0.5) * 0.7,
      spin: (Math.random() - 0.5) * 0.8,
      life: 0,
      maxLife: 7 + Math.random() * 4,
      hue: 335 + Math.random() * 25,
    });
    if (hearts.length > 160) hearts.shift();
  }

  function burst(x, y, n) {
    for (let i = 0; i < n; i += 1) {
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.4;
      const sp = 120 + Math.random() * 260;
      bursts.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 80,
        s: 5 + Math.random() * 10,
        life: 0,
        maxLife: 1.1 + Math.random() * 0.8,
        rot: Math.random() * 6,
      });
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    ctx.clearRect(0, 0, W, H);

    if (!reduceMotion && Math.random() < dt * 2.2) spawn();

    for (let i = hearts.length - 1; i >= 0; i -= 1) {
      const h = hearts[i];
      h.life += dt;
      if (h.life > h.maxLife) { hearts.splice(i, 1); continue; }
      h.x += (h.vx + Math.sin((h.life + h.s) * 1.8) * 14) * dt;
      h.y += h.vy * dt;
      h.rot += h.spin * dt;
      const k = h.life / h.maxLife;
      const a = k < 0.12 ? k / 0.12 : 1 - Math.max(0, (k - 0.6) / 0.4);
      ctx.globalAlpha = a * 0.5;
      heartPath(h.x, h.y, h.s, h.rot);
      ctx.fillStyle = `hsla(${h.hue}, 90%, 78%, 1)`;
      ctx.fill();
    }

    for (let i = bursts.length - 1; i >= 0; i -= 1) {
      const b = bursts[i];
      b.life += dt;
      if (b.life > b.maxLife) { bursts.splice(i, 1); continue; }
      b.vy += 420 * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      const k = b.life / b.maxLife;
      ctx.globalAlpha = 1 - k * k;
      heartPath(b.x, b.y, b.s * (1 - k * 0.35), b.rot);
      ctx.fillStyle = `hsla(${340 + k * 20}, 92%, ${72 - k * 12}%, 1)`;
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  // ---------- 打字机 ----------
  const text = LINES.join("\n") + "\n\n" + QUESTION;
  let idx = 0;
  let typing = false;
  let skip = false;

  function type() {
    typing = true;
    const step = () => {
      if (skip) {
        typedEl.textContent = text;
        finishTyping();
        return;
      }
      if (idx >= text.length) { finishTyping(); return; }
      const ch = text[idx];
      idx += 1;
      typedEl.textContent = text.slice(0, idx);
      const delay = ch === "\n" ? 220 : /[，。！？…]/.test(ch) ? 260 : 62;
      setTimeout(step, reduceMotion ? 8 : delay);
    };
    step();
  }

  function finishTyping() {
    typing = false;
    caret.style.display = "none";
    actions.classList.add("show");
  }

  // ---------- 按钮 ----------
  const yes = document.getElementById("yes");
  const no = document.getElementById("no");
  let dodge = 0;
  const DODGE_TEXT = ["再想想", "真的不再想想？", "那…再想想？", "好吧，就一下下", "再想想嘛", "（点左边吧）"];

  function moveNo() {
    dodge += 1;
    const cardRect = card.getBoundingClientRect();
    const r = no.getBoundingClientRect();
    // 在卡片内随机躲开
    const maxX = Math.max(0, cardRect.width - r.width - 24);
    const maxY = Math.max(0, cardRect.height - r.height - 24);
    no.style.position = "relative";
    no.style.left = (Math.random() * maxX - maxX / 2).toFixed(0) + "px";
    no.style.top = (Math.random() * maxY - maxY / 2).toFixed(0) + "px";
    no.style.opacity = String(Math.max(0.35, 1 - dodge * 0.12));
    no.textContent = DODGE_TEXT[Math.min(dodge, DODGE_TEXT.length - 1)];
    if (dodge >= 4) no.style.transform = "scale(0.86)";
  }

  no.addEventListener("pointerenter", moveNo);
  no.addEventListener("click", (e) => { e.preventDefault(); moveNo(); });

  yes.addEventListener("click", () => {
    const rect = yes.getBoundingClientRect();
    burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 26);
    document.getElementById("finalBig").textContent = FINAL_BIG;
    document.getElementById("finalSub").textContent = FINAL_SUB;
    card.classList.add("hide");
    setTimeout(() => {
      card.style.display = "none";
      finalEl.classList.add("show");
      for (let i = 0; i < 4; i += 1) {
        setTimeout(() => burst(W * (0.2 + Math.random() * 0.6), H * (0.25 + Math.random() * 0.4), 18), i * 180);
      }
    }, 420);
  });

  addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    if (typing) skip = true;
  });

  addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
  setTimeout(type, 500);
})();
</script>
</body>
</html>
