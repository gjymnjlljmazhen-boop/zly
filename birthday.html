<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1e">
<title>16 岁生日快乐</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a1e; }
  canvas { display: block; width: 100%; height: 100%; }
  .hint {
    position: fixed; left: 0; right: 0;
    bottom: max(60px, calc(env(safe-area-inset-bottom) + 56px));
    text-align: center;
    color: rgba(210, 200, 255, 0.45);
    font: 12px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    letter-spacing: 0.2em;
    pointer-events: none;
    transition: opacity 1s ease;
  }
  .hint.hide { opacity: 0; }
  #sound {
    position: fixed;
    right: 14px;
    bottom: max(14px, env(safe-area-inset-bottom));
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(235, 205, 235, 0.2);
    background: rgba(20, 16, 32, 0.6);
    color: rgba(255, 230, 240, 0.9);
    font-size: 16px; line-height: 1;
    cursor: pointer; z-index: 6;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #sound:active { transform: scale(0.94); }
</style>
</head>
<body>
<canvas id="cake"></canvas>
<button id="sound" aria-label="音乐开关">🔊</button>
<div class="hint" id="hint">点一下，吹蜡烛 · 生日歌会响起</div>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("cake");
  const ctx = canvas.getContext("2d");
  const hint = document.getElementById("hint");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const BIRTHDAY_NUMBER = "16";   // 想改年龄就改这里

  let W = 0, H = 0, dpr = 1;
  let cx = 0, cy = 0, S = 1;
  const FOCAL = 700;
  let rot = 0;

  const cakePoints = [];
  const numberPoints = [];
  const flames = [];
  const confetti = [];

  // 5 层，从下往上逐层变小变矮
  const TIERS = [
    { r: 132, y0: -96, y1: -72, color: [255, 209, 224] },
    { r: 115, y0: -72, y1: -48, color: [205, 180, 246] },
    { r: 98,  y0: -48, y1: -24, color: [168, 230, 207] },
    { r: 81,  y0: -24, y1: 0,   color: [255, 227, 164] },
    { r: 64,  y0: 0,   y1: 24,  color: [255, 183, 200] },
  ];

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H * 0.60;
    // 五层更宽更高，整体缩一点
    S = (Math.min(W, H) * 0.60) / 265;
    buildNumber();
  }

  function buildCake() {
    cakePoints.length = 0;
    TIERS.forEach((tier) => {
      const latCount = Math.round(1350 * (tier.r / 132));
      for (let i = 0; i < latCount; i += 1) {
        const a = Math.random() * Math.PI * 2;
        const y = tier.y0 + Math.random() * (tier.y1 - tier.y0);
        const jitter = (Math.random() - 0.5) * 2.4;
        cakePoints.push({
          x: Math.cos(a) * (tier.r + jitter),
          y,
          z: Math.sin(a) * (tier.r + jitter),
          color: tier.color,
          size: 1.1 + Math.random() * 1.3,
          phase: Math.random() * Math.PI * 2,
          top: false,
        });
      }

      const topCount = Math.round(380 * (tier.r / 132));
      for (let i = 0; i < topCount; i += 1) {
        const r = Math.sqrt(Math.random()) * tier.r;
        const a = Math.random() * Math.PI * 2;
        cakePoints.push({
          x: Math.cos(a) * r,
          y: tier.y1,
          z: Math.sin(a) * r,
          color: [
            Math.min(255, tier.color[0] + 22),
            Math.min(255, tier.color[1] + 22),
            Math.min(255, tier.color[2] + 22),
          ],
          size: 1.2 + Math.random() * 1.4,
          phase: Math.random() * Math.PI * 2,
          top: true,
        });
      }

      // 每层顶部一圈更亮的"奶油边"
      for (let i = 0; i < 280; i += 1) {
        const a = Math.random() * Math.PI * 2;
        cakePoints.push({
          x: Math.cos(a) * tier.r,
          y: tier.y1 + Math.sin(a * 6) * 1.6,
          z: Math.sin(a) * tier.r,
          color: [255, 250, 252],
          size: 1.4 + Math.random() * 1.2,
          phase: Math.random() * Math.PI * 2,
          top: true,
        });
      }
    });
  }

  function buildNumber() {
    numberPoints.length = 0;
    const off = document.createElement("canvas");
    off.width = 400;
    off.height = 200;
    const octx = off.getContext("2d");
    octx.clearRect(0, 0, 400, 200);
    octx.fillStyle = "#fff";
    octx.textAlign = "center";
    octx.textBaseline = "middle";
    octx.font = '900 150px system-ui, -apple-system, "PingFang SC", sans-serif';
    octx.fillText(BIRTHDAY_NUMBER, 200, 106);

    const data = octx.getImageData(0, 0, 400, 200).data;
    for (let y = 0; y < 200; y += 3) {
      for (let x = 0; x < 400; x += 3) {
        if (data[(y * 400 + x) * 4 + 3] > 140) {
          numberPoints.push({
            ox: (x - 200) * 0.52,
            oy: (y - 100) * 0.52,
            phase: Math.random() * Math.PI * 2,
          });
        }
      }
    }
  }

  function project(x, y, z) {
    const cos = Math.cos(rot);
    const sin = Math.sin(rot);
    const rx = x * cos - z * sin;
    const rz = x * sin + z * cos;
    const p = FOCAL / (FOCAL + rz);
    return { X: cx + rx * p * S, Y: cy - y * p * S, p, depth: rz };
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0b0b22");
    g.addColorStop(0.55, "#0a0a1e");
    g.addColorStop(1, "#050510");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const glow = ctx.createRadialGradient(cx, cy - 40, 0, cx, cy - 40, Math.max(W, H) * 0.52);
    glow.addColorStop(0, "rgba(150, 130, 255, 0.13)");
    glow.addColorStop(1, "rgba(150, 130, 255, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
  }

  function drawCake(time) {
    for (let i = 0; i < cakePoints.length; i += 1) {
      const p = cakePoints[i];
      const q = project(p.x, p.y, p.z);
      const front = q.depth < 0 ? 1 : 0.62;
      const twinkle = 0.75 + 0.25 * Math.sin(time * 2.2 + p.phase);
      const alpha = front * twinkle * (p.top ? 0.95 : 0.8);
      const size = p.size * q.p * 1.15;
      ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${alpha.toFixed(3)})`;
      ctx.fillRect(q.X, q.Y, size, size);
    }
  }

  function drawNumber(time) {
    // 数字压在第五层上方（y=24 是顶面）
    const baseY = cy - 78 * S;
    const bob = Math.sin(time * 1.6) * 2.4;
    for (let i = 0; i < numberPoints.length; i += 1) {
      const p = numberPoints[i];
      const flicker = 0.72 + 0.28 * Math.sin(time * 6 + p.phase);
      const x = cx + p.ox * S * 1.02;
      const y = baseY + p.oy * S * 1.02 + bob;
      const warm = i % 7 === 0;
      ctx.fillStyle = warm
        ? `rgba(255, 236, 190, ${(0.9 * flicker).toFixed(3)})`
        : `rgba(255, ${120 + ((i * 13) % 80)}, 110, ${(0.82 * flicker).toFixed(3)})`;
      ctx.fillRect(x, y, 1.7 * S, 1.7 * S);
    }
  }

  function spawnFlame() {
    const baseY = cy - 168 * S;
    flames.push({
      x: cx + (Math.random() - 0.5) * 6,
      y: baseY,
      vx: (Math.random() - 0.5) * 12,
      vy: -(26 + Math.random() * 30),
      life: 0,
      maxLife: 0.7 + Math.random() * 0.8,
      r: 1.6 + Math.random() * 2.2,
    });
  }

  function updateFlames(dt) {
    if (!reduceMotion && Math.random() < 0.9) spawnFlame();
    for (let i = flames.length - 1; i >= 0; i -= 1) {
      const f = flames[i];
      f.life += dt;
      if (f.life > f.maxLife) { flames.splice(i, 1); continue; }
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      const k = f.life / f.maxLife;
      ctx.fillStyle = k < 0.4
        ? `rgba(255, 240, 200, ${(1 - k).toFixed(2)})`
        : `rgba(255, 150, 90, ${(0.8 * (1 - k)).toFixed(2)})`;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (1 - k * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function initConfetti() {
    confetti.length = 0;
    for (let i = 0; i < 70; i += 1) {
      confetti.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vy: 8 + Math.random() * 26,
        vx: (Math.random() - 0.5) * 16,
        r: 0.8 + Math.random() * 1.8,
        hue: [340, 265, 200, 45][(Math.random() * 4) | 0],
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function updateConfetti(dt, time) {
    for (const c of confetti) {
      c.y += c.vy * dt;
      c.x += (c.vx + Math.sin(time * 0.8 + c.phase) * 10) * dt;
      if (c.y > H + 6) { c.y = -6; c.x = Math.random() * W; }
      const a = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(time * 2 + c.phase));
      ctx.fillStyle = `hsla(${c.hue}, 90%, 78%, ${a.toFixed(2)})`;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ================= 生日歌（WebAudio 合成） =================
  const AudioCtor = window.AudioContext || window.webkitAudioContext;
  let ac = null, master = null, delayNode = null;
  let muted = false;
  try { muted = localStorage.getItem("birthday.muted") === "1"; } catch {}
  let loopTimer = null;
  const playing = [];   // 已排程的音符，静音时要一起停掉

  // Happy Birthday：音高 + 拍数（3/4 拍）
  const MELODY = [
    [392.00, 0.75], [392.00, 0.25], [440.00, 1], [392.00, 1], [523.25, 1], [493.88, 2],
    [392.00, 0.75], [392.00, 0.25], [440.00, 1], [392.00, 1], [587.33, 1], [523.25, 2],
    [392.00, 0.75], [392.00, 0.25], [783.99, 1], [659.25, 1], [523.25, 1], [587.33, 1], [523.25, 2],
    [698.46, 0.75], [698.46, 0.25], [659.25, 1], [523.25, 1], [587.33, 1], [523.25, 2],
  ];
  const BEAT = 0.44;   // 每拍秒数

  function initAudio() {
    if (ac || !AudioCtor) return;
    ac = new AudioCtor();
    master = ac.createGain();
    master.gain.value = 0;
    master.connect(ac.destination);

    // 一点点空间感
    delayNode = ac.createDelay(1.5);
    delayNode.delayTime.value = 0.28;
    const fb = ac.createGain(); fb.gain.value = 0.22;
    const wet = ac.createGain(); wet.gain.value = 0.25;
    delayNode.connect(fb); fb.connect(delayNode);
    delayNode.connect(wet); wet.connect(master);
  }

  function playNote(freq, at, dur) {
    const osc = ac.createOscillator();
    osc.type = "triangle";
    osc.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.17, at + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, at + Math.max(0.14, dur));
    osc.connect(g);
    g.connect(master);
    g.connect(delayNode);
    osc.start(at);
    osc.stop(at + dur + 0.12);
    playing.push(osc);
  }

  function scheduleSong(startAt) {
    let t = startAt;
    for (const [freq, beats] of MELODY) {
      const dur = beats * BEAT;
      playNote(freq, t, dur * 0.92);
      t += dur;
    }
    return t;
  }

  function startSong() {
    if (!ac || muted) return;
    clearTimeout(loopTimer);
    const end = scheduleSong(ac.currentTime + 0.12);
    const wait = Math.max(500, (end - ac.currentTime) * 1000 + 700);
    loopTimer = setTimeout(() => { if (!muted) startSong(); }, wait);
  }

  function startAudio() {
    initAudio();
    if (!ac) return;
    if (ac.state === "suspended") ac.resume();
    if (!muted) {
      master.gain.setTargetAtTime(0.5, ac.currentTime, 0.8);
      startSong();
    }
  }

  function setMuted(next) {
    muted = next;
    try { localStorage.setItem("birthday.muted", muted ? "1" : "0"); } catch {}
    const btn = document.getElementById("sound");
    if (btn) {
      btn.textContent = muted ? "🔇" : "🔊";
      btn.setAttribute("aria-label", muted ? "打开生日歌" : "关闭生日歌");
    }
    if (ac) master.gain.setTargetAtTime(muted ? 0 : 0.5, ac.currentTime, 0.3);
    if (muted) {
      clearTimeout(loopTimer);
      // 把已排程还没播完的音符停掉，避免解除静音后两条旋律叠在一起
      for (const osc of playing) { try { osc.stop(); } catch {} }
      playing.length = 0;
    } else if (ac) {
      startSong();
    }
  }

  const soundBtn = document.getElementById("sound");
  if (!AudioCtor) soundBtn.style.display = "none";
  else {
    soundBtn.textContent = muted ? "🔇" : "🔊";
    soundBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (muted) { startAudio(); setMuted(false); }
      else setMuted(true);
    });
  }

  // ================= 主循环 =================
  let last = performance.now();
  let lastDraw = 0;
  const start = last;
  const FRAME_GAP = 1000 / 45;

  function frame(now) {
    requestAnimationFrame(frame);
    if (now - lastDraw < FRAME_GAP) return;
    lastDraw = now;

    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const time = (now - start) / 1000;

    if (!reduceMotion) rot += dt * 0.32;

    drawBackground();
    updateConfetti(dt, time);

    ctx.globalCompositeOperation = "lighter";
    drawCake(time);
    drawNumber(time);
    updateFlames(dt);
    ctx.globalCompositeOperation = "source-over";
  }

  addEventListener("pointerdown", (e) => {
    if (e.target && e.target.closest && e.target.closest("#sound")) return;
    startAudio();
    hint.classList.add("hide");
    // 吹蜡烛
    for (let i = 0; i < 40; i += 1) {
      flames.push({
        x: cx + (Math.random() - 0.5) * 10,
        y: cy - 168 * S,
        vx: (Math.random() - 0.5) * 160,
        vy: -(40 + Math.random() * 120),
        life: 0,
        maxLife: 0.6 + Math.random() * 0.5,
        r: 1.4 + Math.random() * 2.6,
      });
    }
  });

  addEventListener("resize", () => { resize(); initConfetti(); });
  resize();
  buildCake();
  initConfetti();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
